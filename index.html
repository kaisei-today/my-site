    <style>
        /* 基本設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f7fbfc; /* 柔らかな水色 */
            color: #4a5555;
            font-family: 'Sawarabi Mincho', serif;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダーエリア */
        header {
            background-color: #faf0e6;
            padding-top: 10px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 0.2em;
            color: #7a8888;
        }

        /* ナビゲーション（タブ） */
        nav {
            background-color: #faf0e6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav ul li a {
            display: block;
            padding: 7px 20px;
            margin-bottom: 5px;
            margin-left: 5px;
            margin-right: 5px;
            text-decoration: none;
            color: #667777;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background-color: #e4d2d8;
            color: #52662c;
        }

/* ボックス自体の設定 */
        .info-box {
            background-color: #fff;
            padding: 40px 25px; /* 上下の余白をたっぷり取るとおしゃれに見えます */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); /* 影を少し柔らかく */
            margin: 50px 50px;
            text-align: left;
        }

        /* ボックスの中の見出し */
        h2 {
            font-size: 1.6rem;
            border-bottom: 1px solid #d1e5e5;
            padding-bottom: 5px;
            margin-bottom: 30px;
            color: #52662c;
            letter-spacing: 0.1em;
            text-align: center;
            width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto; /* 履歴が増えたらスクロール */
            font-size: 0.95rem;
        }

        .info-list li {
            padding: 8px ;
            border-bottom: 1px dashed #eee;
            display: flex;
        }

        .info-list li span.date {
            width: 120px;
            color: #99a8a8;
            font-weight: bold;
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
        }

        .sns-links {
            margin-bottom: 10px; /* コピーライトとの隙間 */
            text-align: center;
        }

        .sns-links a {
            color: #7a8888; /* アイコンの色（ヘッダーの文字色に合わせました） */
            font-size: 2.0rem; /* アイコンの大きさ */
            text-decoration: none;
            transition: 0.3s;
        }

        .sns-links a:hover {
            color: #f6bfbc; /* マウスを乗せた時の色（見出しの色） */
            opacity: 0.7;
        }

        /* 今いるページのタブの色 */
        nav ul li a.current {
            background-color: #e4d2d8; /* ホバー時と同じ色に */
            color: #52662c;            /* 文字色も強調 */
        }

    </style>
</head>

        <!-- 更新履歴をひとつのボックスにまとめる -->

            </div>
        </div>
