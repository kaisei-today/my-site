<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター紹介｜今日も一日快晴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: さわらび明朝 -->
<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="icon" href="sun.png">

<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7fbfc; /* 柔らかな水色 */
            color: #4a5555;
            font-family: 'Sawarabi Mincho', serif;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h2 {text-align: center;}

        h3 {text-align: center;
            color: #006400;}

        /* ヘッダーエリア */
        header {
            background-color: #faf0e6;
            padding-top: 10px;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            margin-top: auto;
        }

        
        header h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 0.2em;
            color: #7a8888;
        }

        /* ナビゲーション（タブ） */
        nav {
            background-color: #faf0e6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav ul li a {
            display: block;
            padding: 7px 25px;
            margin-bottom: 5px;
            margin-left: 5px;
            margin-right: 5px;
            text-decoration: none;
            color: #667777;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background-color: #e4d2d8;
            color: #52662c;
        }

/* 二次・一次のセクションを囲む箱 */
.char-section {
    max-width: 900px;
    margin: 0 auto 50px auto;
    padding: 0 20px; }

/* カードを横に並べる魔法 */
.char-grid {
    display: flex;
    flex-wrap: wrap; /* 画面幅が狭いと自動で折り返す */
    justify-content: center;
    gap: 10px; /* カード同士の隙間 */ }

/* 1人分のカード */
.char-card {
    width: 150px; /* スマホでも見やすい幅 */
    text-decoration: none; /* リンクの下線を消す */
    color: inherit;
    transition: transform 0.3s; /* 0.3秒かけて動く */ }

.char-card:hover {
    transform: translateY(-5px); /* マウスを乗せると少し浮く */ }

.char-img {
    width: 100%;
    height: 140px;
    object-fit: cover; /* 画像を枠にピッタリ合わせる */
    border-radius: 10px; /* 角を丸くする */ }

.char-name {
    margin-bottom: 5px;
    font-size: 15px; 
    text-align: center;}

nav ul li a.current {
            background-color: #e4d2d8; /* ホバー時と同じ色に */
            color: #52662c;            /* 文字色も強調 */
        }
</style>
</head>

<body>
    <header>
        <h1>今日も一日快晴</h1>

    <nav>
        <ul>
            <li><a href="index.html">トップ</a></li>
            <li><a href="characters.html" class="current">キャラクター紹介</a></li>
            <li><a href="library.html">小説・詩</a></li>
            <li><a href="review.html">感想</a></li>
        </ul>
    </nav>
    </header>

<section class="char-section">
    <h2>固定夢主</h2>
    
    <div class="char-grid">
        <a href="aotake.html" class="char-card">
            <img src="sakuratonihontou.jpg" class="char-img">
            <div class="char-name">蒼竹</div>
        </a>
    </div>
</section>

<section class="original-area">
    <h2>オリジナル</h2>

    <div class="cp-group">
        <h3>BL: こうみつ</h3>
        <div class="char-grid">
            <a href="kurose.html" class="char-card">
                <img src="tabako.jpg" class="char-img">
                <div class="char-name">黒瀬 恒</div>
            </a>
            <a href="sinnmiya.html" class="char-card">
                <img src="himawari.jpg" class="char-img">
                <div class="char-name">新宮 光城</div>
            </a>
        </div>
    </div>
</section>


<footer>
    &copy; 2026 晴凪
</footer>

</body>
</html>
