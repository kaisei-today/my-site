<style>
body { display: flex;
    background-image: url("tabako.jpg");
    background-size: cover; /* 横幅100%、高さは自動 */
    background-repeat: no-repeat; /* 写真を繰り返さない */
    background-position: center; 
    background-attachment: fixed; 
    position: relative;
    z-index: 0; 
    font-family: 'Yomogi', cursive;
            color: #333; /* 文字は濃いグレーで読みやすく */

            margin: 0;
    flex-direction: column; /* 上から下に並べる */
    min-height: 100vh;      /* ★画面の高さ(100%)を最低限確保する */
    margin: 0; }

body::before {
    content: "";
    position: fixed; /* 画面に固定 */
    top: 0; left: 0;
    width: 100%; height: 100%;
    /* ★ここが重要！ rgba(赤, 緑, 青, 透明度) */
    /* 最後の「0.7」が透明度（0〜1）。数字が小さいほど透明！ */
    background-color: rgba(255, 255, 255, 0.7); /* 白い幕を70%の濃さで */
    z-index: -1; /* 文字の後ろに回す */ }            
      
footer {

hr {

.mini-bookshelf {
    background-color: #faf0e6; /* ヘッダーと同じ色にすると馴染むよ */

    position: sticky; /* ★スクロールしても上についてくる魔法！ */
    top: 0;
    z-index: 100; }

.nav-link {
    margin: 0 10px;
    text-decoration: none;
    color: #000000;
    font-weight: bold;
    font-size: 16px; }

.nav-link:hover {
    color: #8d9999; /* マウスを乗せると色が変わる */ }

        /* 今いるページの文字のデザイン */
.current-page {
    color: #696969;    /* 好きな色に変えてね！ */
    font-weight: bold; /* 太字にする */
    cursor: default;   /* マウスを置いても「指マーク」にならないようにする */
    display: inline-block; /* ← これを入れると「文字選択」になりにくくなります */ }

.current-page:hover { color: #696969; }

.main-content {
            background-color: rgba(255, 255, 255, 0.8); /* ここも半透明の白！ */
            max-width: 700px;
            width: 85%;
            margin: 10px auto;
            padding: 40px;
            border-radius: 20px; 
            letter-spacing: 0.1em;}

h1 { color: #191970; margin-top: 0; }
h1 small { font-size: 0.8em; color: #888; }
h2 { color: #191970; }
h3 { font-weight: normal; }

.main-content h4 { 
            font-size: 18px;        
            margin-top: 30px;
            margin-bottom: 5px;}

.midashi-title p { margin-top: 0px;}            

.char-quote {
            font-size: 1.3rem;
            color: #555;
            border-left: 5px solid #165e83; /* 若草色の縦線 */
            padding: 20px;
            margin: 5px 100px;
            text-align: left;
            border-radius: 5px;  }

.status-table td {
            border-bottom: 1px dashed #ccc;
            padding: 10px 5px;
            text-align: left; }

.status-label { font-weight: bold; color: #666; width: 30%; }

.status-table {
    width: 100%;
    table-layout: auto; /* ★ここ！ fixed から auto に戻しましょう。こっちの方が今回は安全です！ */
    border-collapse: collapse;
    margin: 10px 0; }
</style>
